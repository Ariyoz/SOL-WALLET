[workspace]
resolver = "2"
members = [
    "crates/wallet-core",
    "crates/api",
    "crates/storage",
]

# ── Windows OpenSSL workaround ─────────────────────────────────────────────
# solana-secp256r1-program pulls openssl-sys which needs a full Perl install
# to compile from source on Windows. We replace it with a stub that keeps
# the same public API but drops the openssl dependency entirely.
# The wallet never calls secp256r1 precompile verification, so this is safe.
[patch.crates-io]
solana-secp256r1-program = { path = "patches/solana-secp256r1-program" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level    = 3
lto          = true
codegen-units = 1
